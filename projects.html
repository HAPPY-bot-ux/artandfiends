<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects | ARC Atelier</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
body{background:#0f0f0f;}
.glass{backdrop-filter:blur(20px);background:rgba(255,255,255,0.05);}
.project{opacity:0;transform:translateY(100px);}
</style>
</head>

<body class="text-white">

<nav class="fixed w-full glass px-10 py-5 flex justify-between z-50">
<h1 class="text-2xl font-bold">ARC Atelier</h1>
<div class="space-x-8">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="projects.html" class="text-yellow-500">Projects</a>
<a href="services.html">Services</a>
<a href="contact.html">Contact</a>
</div>
</nav>

<section class="pt-40 px-20 pb-32">

<h2 class="text-5xl font-bold mb-20">Featured Projects</h2>

<div class="grid md:grid-cols-3 gap-10">

<div class="project glass rounded-xl overflow-hidden transform hover:scale-110 hover:rotate-1 transition">
<img src="https://images.unsplash.com/photo-1502673530728-f79b4cab31b1">
<div class="p-6">
<h3 class="text-xl font-semibold">Skyline Tower</h3>
<p class="text-gray-400">Commercial</p>
</div>
</div>

<div class="project glass rounded-xl overflow-hidden transform hover:scale-110 hover:rotate-1 transition">
<img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb">
<div class="p-6">
<h3 class="text-xl font-semibold">Minimal Villa</h3>
<p class="text-gray-400">Residential</p>
</div>
</div>

<div class="project glass rounded-xl overflow-hidden transform hover:scale-110 hover:rotate-1 transition">
<img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7">
<div class="p-6">
<h3 class="text-xl font-semibold">Urban Complex</h3>
<p class="text-gray-400">Mixed Use</p>
</div>
</div>

</div>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);
gsap.utils.toArray(".project").forEach(el=>{
gsap.to(el,{
scrollTrigger:{trigger:el,start:"top 85%"},
opacity:1,y:0,duration:1.2
});
});
</script>

</body>
</html>
