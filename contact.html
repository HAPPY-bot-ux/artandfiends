<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contact | ARC Atelier</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#0f0f0f;}
.glass{backdrop-filter:blur(20px);background:rgba(255,255,255,0.05);}
</style>
</head>

<body class="text-white">

<nav class="fixed w-full glass px-10 py-5 flex justify-between z-50">
<h1 class="text-2xl font-bold">ARC Atelier</h1>
<div class="space-x-8">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="projects.html">Projects</a>
<a href="services.html">Services</a>
<a href="contact.html" class="text-yellow-500">Contact</a>
</div>
</nav>

<section class="pt-40 px-20 pb-32 grid md:grid-cols-2 gap-20">

<div>
<h2 class="text-5xl font-bold mb-12">Let’s Build Together</h2>

<form class="space-y-8 glass p-12 rounded-2xl">
<div class="relative">
<input type="text" class="peer w-full bg-transparent border-b border-gray-500 focus:border-yellow-500 outline-none py-2">
<label class="absolute left-0 top-2 text-gray-400 peer-focus:-top-4 peer-focus:text-sm transition-all">Full Name</label>
</div>

<div class="relative">
<input type="email" class="peer w-full bg-transparent border-b border-gray-500 focus:border-yellow-500 outline-none py-2">
<label class="absolute left-0 top-2 text-gray-400 peer-focus:-top-4 peer-focus:text-sm transition-all">Email</label>
</div>

<div class="relative">
<textarea class="peer w-full bg-transparent border-b border-gray-500 focus:border-yellow-500 outline-none py-2"></textarea>
<label class="absolute left-0 top-2 text-gray-400 peer-focus:-top-4 peer-focus:text-sm transition-all">Message</label>
</div>

<button class="mt-8 bg-yellow-500 text-black px-8 py-3 rounded-full hover:scale-110 transition">
Send Message
</button>

</form>
</div>

<div>
<iframe class="w-full h-full rounded-2xl"
src="https://maps.google.com/maps?q=london&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</div>

</section>

</body>
</html>
