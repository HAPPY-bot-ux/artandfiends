<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⟳ ARTANDFIENDS · BOOT SEQUENCE</title>

    <!-- same core stack: tailwind + gsap + three + fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Mono&display=swap" rel="stylesheet">

    <style>
        /* === base styling from main (same colors, cursors) === */
        :root { 
            --primary: #1E3A5F;      /* Deep navy */
            --secondary: #4A6FA5;    /* Slate blue */
            --accent: #C3A060;        /* Brass */
            --light: #F5F7FA;         
            --dark: #0B1A2A;          
        }
        
        body { 
            background: var(--dark); 
            color: var(--light); 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            cursor: none;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }
        
        @media (max-width: 768px) {
            body { cursor: auto; }
            #cursor, #cursor-follower { display: none; }
        }
        
        .mono { font-family: 'Space Mono', monospace; }
        
        #cursor { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 10000; }
        #cursor-follower { width: 40px; height: 40px; border: 1px solid var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transition: transform 0.15s ease-out; }

        /* loading specific */
        .boot-screen {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        /* central scanning ring */
        .scan-ring {
            width: 200px;
            height: 200px;
            border: 1px solid rgba(195, 160, 96, 0.3);
            border-radius: 50%;
            position: relative;
            margin-bottom: 3rem;
            animation: pulseRing 3s infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .scan-ring-inner {
            position: absolute;
            inset: 20px;
            border: 1px dashed var(--accent);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            transform: translateX(-50%);
            animation: scanMove 2.5s ease-in-out infinite;
        }
        @keyframes scanMove {
            0% { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            50% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(100%); opacity: 0; }
        }

        /* loading bars */
        .progress-container {
            width: 300px;
            margin: 2rem 0;
        }
        .progress-track {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }

        .status-text {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 1rem;
        }

        /* boot messages */
        .boot-messages {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            font-size: 0.6rem;
            line-height: 1.8;
            opacity: 0.5;
            font-family: 'Space Mono';
        }
        @media (max-width: 768px) {
            .boot-messages { left: 1.5rem; bottom: 1.5rem; }
        }

        .enter-btn {
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            padding: 1rem 3rem;
            font-family: 'Space Mono';
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: all 0.4s;
            opacity: 0;
            transform: translateY(20px);
            margin-top: 2rem;
            pointer-events: none;
            text-decoration: none;
            display: inline-block;
        }
        .enter-btn.revealed {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .enter-btn:hover {
            background: var(--accent);
            color: var(--dark);
            box-shadow: 0 0 30px var(--accent);
        }

        /* 3d canvas background */
        #bg3d { 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 0; 
            pointer-events: none; 
            opacity: 0.2;
        }

        /* mobile adjustments */
        @media (max-width: 768px) {
            .scan-ring { width: 150px; height: 150px; }
            .progress-container { width: 250px; }
        }
    </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-follower"></div>

<canvas id="bg3d"></canvas>

<div class="boot-screen" style="background: url(./images/image1.jpg);">
    <!-- animated scanning element -->
    <div class="scan-ring">
        <div class="scan-ring-inner"></div>
        <div class="scan-line"></div>
    </div>

    <!-- loading bar with percentage -->
    <div class="progress-container">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="flex justify-between mono text-[10px] mt-2">
            <span>SYSTEM BOOT</span>
            <span id="percentDisplay">0%</span>
        </div>
    </div>

    <div class="status-text" id="statusMessage">INITIALISING SECURE CHANNEL</div>

    <!-- hidden enter button (revealed after load) -->
    <a href="home.html" class="enter-btn" id="enterBtn">⟫ ENTER SITE ⟪</a>

    <!-- boot log messages -->
    <div class="boot-messages mono">
        <div>> BIOS version 2.0.6</div>
        <div>> CPU: ARCHITECTURE_64</div>
        <div id="bootMsg">> MEMORY CHECK ...</div>
        <div id="bootTime">> SYSTEM TIME: --:--:--</div>
    </div>
</div>

<script>
    // cursor (same as main)
    const cursor = document.getElementById("cursor");
    const follower = document.getElementById("cursor-follower");
    if (cursor && follower) {
        document.addEventListener("mousemove", (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
            gsap.to(follower, { x: e.clientX - 20, y: e.clientY - 20, duration: 0.3 });
        });
    }

    // three.js background (simplified, matches main aesthetic)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("bg3d"), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // grid
    const gridHelper = new THREE.GridHelper(30, 20, 0x4A6FA5, 0x1E3A5F);
    gridHelper.position.y = -5;
    scene.add(gridHelper);

    // floating wireframe cubes
    const cubes = [];
    for (let i = 0; i < 40; i++) {
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xC3A060, wireframe: true, transparent: true, opacity: 0.1 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.x = (Math.random() - 0.5) * 30;
        cube.position.y = (Math.random() - 0.5) * 20;
        cube.position.z = (Math.random() - 0.5) * 30;
        cube.scale.set(Math.random() * 2 + 0.5, Math.random() * 2 + 0.5, Math.random() * 2 + 0.5);
        scene.add(cube);
        cubes.push(cube);
    }

    camera.position.z = 20;
    camera.position.y = 5;

    function animate() {
        requestAnimationFrame(animate);
        cubes.forEach(cube => {
            cube.rotation.x += 0.001;
            cube.rotation.y += 0.002;
        });
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // BOOT SEQUENCE SIMULATION
    let progress = 0;
    const totalTime = 4000; // 4 seconds
    const interval = 50; // update every 50ms
    const steps = totalTime / interval;
    const increment = 100 / steps;

    const progressFill = document.getElementById('progressFill');
    const percentDisplay = document.getElementById('percentDisplay');
    const statusMsg = document.getElementById('statusMessage');
    const bootMsg = document.getElementById('bootMsg');
    const bootTime = document.getElementById('bootTime');
    const enterBtn = document.getElementById('enterBtn');

    const messages = [
        "> MEMORY CHECK ... OK",
        "> INITIALISING GPU ...",
        "> GPU: DETECTED",
        "> LOADING CORE ASSETS ...",
        "> ASSETS: 42 FILES",
        "> ESTABLISHING SECURE LINK ...",
        "> LINK: ENCRYPTED (AES-256)",
        "> CALIBRATING INTERFACE ...",
        "> READY"
    ];
    let msgIndex = 0;

    // update clock
    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
        bootTime.innerHTML = `> SYSTEM TIME: ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const timer = setInterval(() => {
        progress += increment;
        if (progress >= 100) {
            progress = 100;
            clearInterval(timer);
            statusMsg.innerText = "BOOT COMPLETE · AWAITING INPUT";
            // reveal enter button
            enterBtn.classList.add('revealed');
            // final boot message
            bootMsg.innerHTML = "> SYSTEM ONLINE · READY";
        }

        // update progress bar
        progressFill.style.width = progress + '%';
        percentDisplay.innerText = Math.floor(progress) + '%';

        // update status message and boot log at certain thresholds
        if (progress < 20) {
            statusMsg.innerText = "INITIALISING SECURE CHANNEL";
        } else if (progress < 40) {
            statusMsg.innerText = "LOADING ARCHITECTURAL CORE";
        } else if (progress < 60) {
            statusMsg.innerText = "CALIBRATING DESIGN ENGINE";
        } else if (progress < 80) {
            statusMsg.innerText = "ESTABLISHING DATALINK";
        } else if (progress < 99) {
            statusMsg.innerText = "FINALISING ASSETS";
        }

        // update boot message every few steps
        if (Math.floor(progress) % 12 === 0 && msgIndex < messages.length - 1) {
            msgIndex++;
            bootMsg.innerHTML = messages[msgIndex];
        }
    }, interval);

    // optional: skip animation on click (for development)
    document.addEventListener('click', () => {
        if (progress < 100) {
            progress = 100;
            progressFill.style.width = '100%';
            percentDisplay.innerText = '100%';
            statusMsg.innerText = "BOOT COMPLETE · AWAITING INPUT";
            bootMsg.innerHTML = "> SYSTEM ONLINE · READY";
            enterBtn.classList.add('revealed');
            clearInterval(timer);
        }
    });
</script>

</body>
</html>
